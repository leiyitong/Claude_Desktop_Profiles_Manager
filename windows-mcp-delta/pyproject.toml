[project]
name = "windows-mcp-delta"
version = "0.1.0"
description = "Windows-MCP, extended: all of its tools, some of them done more, and more of them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "windows-mcp>=0.8.8,<0.9",
    "pypdf>=5.0",
    "psutil>=7.0",
    "requests>=2.33",
    "markdownify>=1.1",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "pillow>=10.0",
]

[project.scripts]
windows-mcp-delta = "windows_mcp_delta.__main__:main"

[tool.uv]
# What uv rebuilds the package for: its source too, not only pyproject.toml (its default), so that a folder
# whose code changed is never run from what an earlier build of it left in uv's cache.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_mcp_delta"]
