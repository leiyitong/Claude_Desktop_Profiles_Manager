name: build

# Only what goes into the exe or its checks starts a build (the changelogs do): a change
# to the other documents alone (README, docs, BUILD.md...) builds nothing. A tag always builds: GitHub does
# not apply path filters to tags.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'windows-mcp-delta/**'
      - 'tools/check-localization.py'
      - 'tools/changelog.py'
      - 'tools/pack-delta.ps1'
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-CN.md'
      - 'build.cmd'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'windows-mcp-delta/**'
      - 'tools/check-localization.py'
      - 'tools/changelog.py'
      - 'tools/pack-delta.ps1'
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-CN.md'
      - 'build.cmd'
      - '.gitattributes'
      - '.github/workflows/build.yml'

# A newer push to a pull request stops the build of the older one; main's builds all
# finish, each publishing its pre-release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # The drawing tests open windows: one left waiting must not hold the runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag against src/version.h
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content src/version.h -Raw), 'APP_VERSION_STR\s+"([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION_STR ""$version"" in src/version.h" }

      # The version numbers must match APP_VERSION_STR too: test_core checks it.
      - name: Build, check the interface catalogs and run the unit tests
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeDesktopProfilesManager
          path: build/ClaudeDesktopProfilesManager.exe
          if-no-files-found: error

  # A day's builds of main make one release, as a day's commits make one version: tagged and named
  # after the day (v<APP_VERSION_DATE>), unsigned, the latest release, its notes that version's lines
  # in the changelogs. Each push of the day replaces it with its build, unless main has moved on
  # meanwhile (that later push's build replaces it then). update.c checks the upstream's signed
  # releases; ghupdate.c offers this one to copies whose PC signs in to GitHub, by its commit.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: ClaudeDesktopProfilesManager

      - name: Publish the build as the day's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now: its own build publishes the day's release."
            exit 0
          fi
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          version=$(sed -n 's/^#define APP_VERSION_DATE *"\([^"]*\)".*/\1/p' src/version.h)
          tag="v$version"
          {
            echo "> Unsigned build of \`$short\` on main, made by GitHub Actions; a copy installed on a PC signed in to GitHub (gh, or git's credential) offers it when it opens. 未签名的 main 构建：在登录了 GitHub（gh 或 git 凭据）的电脑上，已安装的程序打开时会提示更新到它。"
            echo
            python3 tools/changelog.py --notes latest
          } > notes.md
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" ClaudeDesktopProfilesManager.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Claude Delta v$version" \
            --notes-file notes.md
