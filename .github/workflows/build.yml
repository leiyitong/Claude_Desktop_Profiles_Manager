name: build

# Only what goes into the exe or its checks starts a build: a change to the documents
# alone (README, docs, BUILD.md...) builds nothing. A tag always builds: GitHub does
# not apply path filters to tags.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/check-localization.py'
      - 'build.cmd'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/check-localization.py'
      - 'build.cmd'
      - '.gitattributes'
      - '.github/workflows/build.yml'

# A newer push to a pull request stops the build of the older one; main's builds all
# finish, each publishing its pre-release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # The drawing tests open windows: one left waiting must not hold the runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag against src/version.h
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content src/version.h -Raw), 'APP_VERSION_STR\s+"([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION_STR ""$version"" in src/version.h" }

      # The version numbers must match APP_VERSION_STR too: test_core checks it.
      - name: Build, check the interface catalogs and run the unit tests
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeDesktopProfilesManager
          path: build/ClaudeDesktopProfilesManager.exe
          if-no-files-found: error

  # Every build of main, unsigned, as a pre-release of its own. Pre-releases are not
  # "latest": the README's download link and the update check of installed copies
  # (update.c, releases/latest) keep finding the signed release only.
  prerelease:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ClaudeDesktopProfilesManager

      - name: Publish the build as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create "$TAG" ClaudeDesktopProfilesManager.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Build $GITHUB_RUN_NUMBER ($short)" \
            --notes "Unsigned build of $GITHUB_SHA on main, made by GitHub Actions. An installed copy does not update to it: its update check takes signed releases only."
